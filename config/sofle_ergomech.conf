# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Studio (dòng này OK, nhưng đã pass qua CLI nên có thể bỏ)
# CONFIG_ZMK_STUDIO=y

# USB CDC ACM — tên đúng trong Zephyr 3.5+
CONFIG_USB_CDC_ACM=y

# XÓA các dòng sau nếu có:
# CONFIG_ZMK_STUDIO_UNLOCK=y    ← lỗi
# CONFIG_ZMK_USB_CDC_ACM=y      ← lỗi
